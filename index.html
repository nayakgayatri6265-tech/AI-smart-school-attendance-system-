
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(0, 0, 0, 0.2);
        }

        nav h2 {
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 60px);
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            max-width: 600px;
        }

        button {
            margin-top: 25px;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #6246a5;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #eeeeee;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <nav>
        <h2>My Website</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>Welcome to My Website!</h1>

        <p id="about">
            Python is a popular programming language.
            You can use Python to build web applications,
            create AI projects, and analyze data.
            Start learning and turn your ideas into reality!
        </p>

        <button onclick="showMessage()">Get Started</button>
    </section>

    <footer>
        <p>&copy; 2026 My Website | Made with HTML & CSS</p>
    </footer>

    <script>
        function showMessage() {
            alert("Welcome! Let's start learning web development.");
        }
    </script>

</body>
</html>
